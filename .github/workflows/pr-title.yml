name: pr-title

# Separate from check.yml so that editing a pull request's title or description reruns only this check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|ci|chore|refactor|perf|build|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! $TITLE =~ $pattern ]]; then
            echo "::error::The title becomes the squash commit and sets the version; use Conventional Commits, e.g. 'feat: add zones' or 'fix!: rename output'. Got: $TITLE"
            exit 1
          fi

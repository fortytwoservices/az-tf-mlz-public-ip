name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: Install terraform-docs
        working-directory: ${{ runner.temp }}
        run: |
          version=0.24.0
          base=https://github.com/terraform-docs/terraform-docs/releases/download/v$version
          curl -sSfLO "$base/terraform-docs-v$version-linux-amd64.tar.gz"
          curl -sSfLO "$base/terraform-docs-v$version.sha256sum"
          grep "terraform-docs-v$version-linux-amd64.tar.gz" "terraform-docs-v$version.sha256sum" | sha256sum --check -
          tar -xzf "terraform-docs-v$version-linux-amd64.tar.gz" terraform-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: scripts/check.sh
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          scripts/check.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init: API rate limit and plugin attestations

